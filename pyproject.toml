[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wikistub-seed"
version = "1.1.10"
description = "Local-first multilingual JSON knowledge-stub framework with 630+ stubs for AI research, documentation, RAG and LLM workflows."
readme = "README.md"
authors = [
    { name = "dev-bricks" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown"
]
keywords = [
    "knowledge-base",
    "rag",
    "llm-context",
    "multilingual",
    "local-first",
    "zero-egress",
    "offline-first",
    "json",
    "ontology",
    "wikistub",
    "dev-bricks",
    "open-bricks"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
test = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/WikiStub-Seed"
Repository = "https://github.com/dev-bricks/WikiStub-Seed.git"
Documentation = "https://github.com/dev-bricks/WikiStub-Seed#readme"
"Bug Tracker" = "https://github.com/dev-bricks/WikiStub-Seed/issues"
Issues = "https://github.com/dev-bricks/WikiStub-Seed/issues"
Changelog = "https://github.com/dev-bricks/WikiStub-Seed/blob/master/CHANGELOG.md"
Security = "https://github.com/dev-bricks/WikiStub-Seed/blob/master/SECURITY.md"
"Parent Organization" = "https://github.com/dev-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/dev-bricks/WikiStub-Seed/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/dev-bricks/WikiStub-Seed/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/dev-bricks/WikiStub-Seed/blob/master/llms.txt"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E722", "E741", "F841"]

